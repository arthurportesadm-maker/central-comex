name: Importar da Cloudflare

# Puxa o Worker publicado para src/ e data/ e faz commit.
# Roda sozinho no primeiro push (enquanto src/ não existe) e pode ser disparado
# à mão em Actions → "Importar da Cloudflare" → Run workflow.
on:
  push:
    branches: [main]
    paths: [".github/workflows/importar.yml", "scripts/importar.mjs", ".importar"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Importar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/importar.mjs
      - name: Validar
        run: node scripts/validar.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src data
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Importar Worker publicado na Cloudflare"
          git push
